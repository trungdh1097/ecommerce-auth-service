services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ecommerce_auth
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run ./scripts/init-local.sh first}
    volumes:
      - auth-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d ecommerce_auth"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - '5432:5432'
    command: postgres -c log_statement=all
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.30.1
    ports:
      - "127.0.0.1:8025:8025"
  app:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/ecommerce_auth
      DB_USERNAME: auth
      DB_PASSWORD: ${DB_PASSWORD:?Run ./scripts/init-local.sh first}
      REDIS_HOST: redis
      SMTP_HOST: mailpit
      LOCAL_JWT_PRIVATE_KEY: ${LOCAL_JWT_PRIVATE_KEY:?Run ./scripts/init-local.sh first}
      LOCAL_JWT_PUBLIC_KEY: ${LOCAL_JWT_PUBLIC_KEY:?Run ./scripts/init-local.sh first}
      LOCAL_OTP_HMAC_KEY: ${LOCAL_OTP_HMAC_KEY:?Run ./scripts/init-local.sh first}
      LOCAL_OUTBOX_KEY: ${LOCAL_OUTBOX_KEY:?Run ./scripts/init-local.sh first}
      LOCAL_GOOGLE_WEB_CLIENT_ID: ${LOCAL_GOOGLE_WEB_CLIENT_ID:-}
      LOCAL_GOOGLE_ANDROID_CLIENT_ID: ${LOCAL_GOOGLE_ANDROID_CLIENT_ID:-}
      LOCAL_GOOGLE_IOS_CLIENT_ID: ${LOCAL_GOOGLE_IOS_CLIENT_ID:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
  proxy:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_started
volumes:
  auth-db:
  caddy-data:
  caddy-config:
